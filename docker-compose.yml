services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-investos}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-investos}"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Uncomment to connect from host (e.g. Prisma Studio, psql):
    # ports: ["5432:5432"]

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Compose network overrides whatever DATABASE_URL is in .env —
      # inside the compose network, postgres is reachable as "postgres:5432".
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-investos}?schema=public
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3001}:3001"

volumes:
  postgres-data:
