# Coolify deployment — set this repo as a "Docker Compose" resource.
# Coolify auto-injects SERVICE_FQDN_* and proxies to the exposed port.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Coolify magic var: replaced with the public FQDN it assigns.
    # Remove this block if you set the domain manually in the Coolify UI.
    environment:
      - SERVICE_FQDN_APP_6001
      - NODE_ENV=production
      - PORT=6001
      - HOSTNAME=0.0.0.0
      # ── App secrets — set these in the Coolify "Environment Variables" UI ──
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_CHAT_ID=${TELEGRAM_ALLOWED_CHAT_ID}
      - SEED_USER_EMAIL=${SEED_USER_EMAIL:-}
      - SEED_USER_PASSWORD=${SEED_USER_PASSWORD:-}
    expose:
      - "6001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:6001/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
