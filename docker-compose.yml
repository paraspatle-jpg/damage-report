# For local Docker runs. On Coolify, point the app at this repo's
# Dockerfile directly and inject env vars in the Coolify UI — Coolify
# does not need this compose file.
services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 6001
    ports:
      - "${APP_PORT:-6001}:6001"
